<title>Login — LMS</title>
<link rel="stylesheet" href="style.css">

<style>
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    padding: 24px;
    position: relative;
  }
  .login-page .theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
  }
  .login-card {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 420px;
  }
  .login-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
    justify-content: center;
  }
  .login-logo-icon {
    width: 48px;
    height: 48px;
    background: var(--primary);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    font-family: 'Roboto', sans-serif;
  }
  .login-logo-text {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }
  .login-logo-text span { color: var(--primary); }
  .login-subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 32px;
    margin-top: -20px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
  }
  .divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
  .divider span { color: var(--text-disabled); font-size: 13px; }
  .azure-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 20px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .azure-btn:hover { background: var(--bg); border-color: var(--primary); }
  .azure-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .azure-icon {
    width: 20px; height: 20px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
  }
  .azure-icon span { display: block; border-radius: 1px; }
  .azure-icon span:nth-child(1) { background: #f25022; }
  .azure-icon span:nth-child(2) { background: #7fba00; }
  .azure-icon span:nth-child(3) { background: #00a4ef; }
  .azure-icon span:nth-child(4) { background: #ffb900; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
    border-radius: 6px; font-size: 14px; background: var(--surface); color: var(--text-primary);
    transition: border-color 0.15s; box-sizing: border-box;
  }
  .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(21,101,192,0.12); }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 44px; }
  .toggle-pw {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 18px;
    padding: 0; display: flex;
  }
  .toggle-pw:focus-visible { outline: 2px solid var(--primary); border-radius: 3px; }
  .form-footer { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .form-footer a { font-size: 13px; color: var(--primary); text-decoration: none; }
  .form-footer a:hover { text-decoration: underline; }
  .form-footer a:focus-visible { outline: 2px solid var(--primary); border-radius: 2px; }
  .login-submit { width: 100%; margin-top: 4px; }
  .login-error {
    background: var(--error-bg);
    border: 1px solid var(--error);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--error);
    margin-bottom: 16px;
    display: none;
  }
  .login-error.visible { display: flex; align-items: center; gap: 8px; }
  .locked-notice {
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    color: #856404;
    display: none;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .locked-notice.visible { display: flex; }
  .login-footer { text-align: center; margin-top: 28px; color: var(--text-disabled); font-size: 12px; }
  /* Dark mode surface lift */
  :root[data-theme="dark"] .login-card,
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .login-card { background: var(--surface); } }
</style>

<body>
<div class="login-page" role="main">

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme" title="Toggle light/dark">
    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/>
    </svg>
  </button>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon" aria-hidden="true">L</div>
      <div class="login-logo-text">Leave<span>MS</span></div>
    </div>
    <p class="login-subtitle">Leave Management System</p>

    <!-- Azure AD SSO -->
    <button class="azure-btn" id="azureLoginBtn" aria-label="Sign in with Azure Active Directory">
      <div class="azure-icon" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      Sign in with Azure AD
    </button>

    <div class="divider" role="separator">
      <hr aria-hidden="true"><span>or sign in with email</span><hr aria-hidden="true">
    </div>

    <!-- Local Login Form -->
    <form id="loginForm" novalidate>
      <div class="login-error" id="loginError" role="alert" aria-live="polite">
        <span aria-hidden="true">⚠</span>
        <span id="errorMsg">Invalid email or password. 4 attempts remaining.</span>
      </div>
      <div class="locked-notice" id="lockedNotice" role="alert">
        <span aria-hidden="true">🔒</span>
        <span>Account locked after 5 failed attempts. Contact HR Admin to unlock.</span>
      </div>

      <div class="form-group">
        <label for="email">Work Email</label>
        <input type="email" id="email" name="email" autocomplete="username"
               placeholder="you@company.com" required aria-required="true">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password"
                 placeholder="••••••••" required aria-required="true">
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password" aria-pressed="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-footer">
        <a href="#" aria-label="Forgot your password? Reset it here">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg login-submit">Sign In</button>
    </form>

    <div class="login-footer">
      <p>&copy; 2024 Leave Management System · v1.0</p>
    </div>
  </div>
</div>

<script>
  // Theme toggle
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const icon = document.getElementById('themeIcon');
  const MOON = `<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>`;
  const SUN = `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/>`;
  let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  function applyTheme() {
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    icon.innerHTML = dark ? MOON : SUN;
    btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  applyTheme();
  btn.addEventListener('click', () => { dark = !dark; applyTheme(); });

  // Password toggle
  const pw = document.getElementById('password');
  const tgl = document.getElementById('togglePw');
  tgl.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    tgl.setAttribute('aria-pressed', show);
    tgl.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // Demo: show error state on submit with wrong credentials
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const emailVal = document.getElementById('email').value;
    const pwVal = pw.value;
    if (!emailVal || !pwVal) return;
    // Simulate error for demo
    document.getElementById('loginError').classList.add('visible');
  });

  // Azure AD demo
  document.getElementById('azureLoginBtn').addEventListener('click', () => {
    alert('Azure AD SSO: MSAL redirect flow would trigger here (demo only)');
  });
</script>
