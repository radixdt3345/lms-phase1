name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_test
          POSTGRES_DB: lms_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/LMS.sln

      - name: Build (zero warnings)
        run: dotnet build backend/LMS.sln --no-restore --configuration Release -warnaserror

      - name: Lint (dotnet-format)
        run: dotnet format backend/LMS.sln --verify-no-changes

      - name: Run EF migrations
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=lms_test;Username=lms;Password=lms_test"
        run: dotnet ef database update --project backend/LMS.Infrastructure --startup-project backend/LMS.Api

      - name: Unit tests + coverage
        run: |
          dotnet test backend/LMS.sln \
            --no-build \
            --configuration Release \
            --filter "Category=Unit" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Coverage gate (≥80% lines; 100% for auth/security paths)
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool 2>/dev/null || true
          reportgenerator -reports:coverage/**/coverage.cobertura.xml \
            -targetdir:coverage/report -reporttypes:TextSummary
          COVERAGE=$(grep "Line coverage:" coverage/report/Summary.txt | grep -oP '[\d.]+(?=%)' | head -1)
          echo "Line coverage: ${COVERAGE}%"
          python3 -c "import sys; c=float('${COVERAGE}'); sys.exit(0 if c>=80 else 1)"

      - name: Integration tests
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=lms_test;Username=lms;Password=lms_test"
          ASPNETCORE_ENVIRONMENT: Test
        run: |
          dotnet test backend/LMS.sln \
            --no-build \
            --configuration Release \
            --filter "Category=Integration"

  frontend:
    name: Frontend — Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend

      - name: Unit tests
        run: npm run test -- --coverage --watchAll=false
        working-directory: frontend

      - name: Build (production)
        run: npm run build
        working-directory: frontend
